name: Deploy CloudBase Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudbase-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run cloudbase:build
      - run: npm run cloudbase:config
        env:
          CLOUDBASE_ENV_ID: ${{ secrets.CLOUDBASE_ENV_ID }}
      - run: npx --yes @cloudbase/cli fn deploy --all --yes
        env:
          TCB_CLI_TOKEN: ${{ secrets.TCB_CLI_TOKEN }}
